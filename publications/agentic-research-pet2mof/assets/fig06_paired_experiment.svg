   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #121212" transform="translate(341.325937 424.469175)">G_P = G_C/k + φ(h_P − h_C/k)</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #121212" transform="translate(309.518437 443.669175)">A = G_C/k;  B = A + φ_max(h_P − h_C/k)</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #121212" transform="translate(262.077187 462.869175)">φ_max = min(1, G_C/h_C);  G_P ∈ [min(A, B); max(A, B)]</text>
   </g>

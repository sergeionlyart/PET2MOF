  </g>
  <g id="text_13">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #5c5c59" transform="translate(34.56 527.805234)">Источник: reports/task003/next_experiment.md. Не научный запуск, run_id не применим.</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #5c5c59" transform="translate(34.56 539.869102)">Гипотеза: одинаковы абсолютный PEI-вклад на грамм композита и φ. h_P, h_C — доли носителя.</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #5c5c59" transform="translate(34.56 551.90543)">Интервал фиксируют до измерения q(P1); попадание внутрь не определяет механизм и не измеряет φ.</text>

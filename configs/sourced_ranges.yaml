schema_version: T014-v1
description: Provisional parameter evidence. Scenario retains broad stress bounds; literature_ranges are separate
  conditional analog observables, NOT automatically applied priors. No model/tolerance changes.
review_required: T014v / T016
blindness: No S2, S113, S103, S102 or S117/Madden 2021 source files or holdout datasets opened.
